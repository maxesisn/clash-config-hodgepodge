output: /path/to/surge.conf
base_sub_groups:
  main:
    name: My Airport
    url: https://example.com/subscribe?surge=smart
    user_agent: surge/5.0
    proxy_groups:
      main_select: Proxy
      special_groups:
        adblock: REJECT
        domestic: DIRECT
        ai: AI
active_group: main
sources:
  - https://example.com/third-party-subscribe?token=abc123
proxies:
  HK Snell: "snell, 3.3.3.3, 4443, psk=example-psk, version=4, obfs=shadowtls, obfs-host=addons.mozilla.org"
  JP VLESS: "vless, 2.2.2.2, 443, username=b691ff92-8576-4e8d-922e-a749cde5f99b, tls=true"
rules:
  - DOMAIN,example.com,{ai}
  - DST-PORT,3478,DIRECT
